name: Android CI

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write
  actions: write

concurrency:
  group: debug-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Delete previous APK artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            )

            const apkArtifacts = artifacts.filter(({ name }) => {
              const normalizedName = name.toLowerCase()
              return normalizedName.includes('apk') ||
                normalizedName.startsWith('agent-bayu-')
            })

            core.info(`Found ${apkArtifacts.length} previous APK artifact(s).`)

            for (const artifact of apkArtifacts) {
              core.info(`Deleting ${artifact.name} (${artifact.id}).`)
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              })
            }

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-disabled: false
          cache-read-only: false

      - name: Build debug APK
        run: gradle assembleDebug --parallel --build-cache

      - name: Prepare APK file
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          debug_apks=(app/build/outputs/apk/debug/*.apk)

          if [[ ${#debug_apks[@]} -ne 1 ]]; then
            echo "Expected exactly one debug APK, found ${#debug_apks[@]}."
            exit 1
          fi

          mkdir -p dist
          cp "${debug_apks[0]}" dist/agent-bayu-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          path: dist/agent-bayu-debug.apk
          archive: false
          overwrite: true
          retention-days: 1
          if-no-files-found: error

      - name: Publish debug APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug --yes --cleanup-tag || true
          gh release create debug dist/agent-bayu-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Debug APK" \
            --notes "Debug build from ${GITHUB_REF_NAME} (${GITHUB_SHA})." \
            --prerelease

      - name: Run lint and unit tests
        run: gradle lint testDebugUnitTest --parallel --build-cache

      - name: Show lint report
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob globstar
          for report in app/build/**/lint-results-*.txt; do
            echo "::group::${report}"
            cat "${report}"
            echo "::endgroup::"
          done
